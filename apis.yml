aid: keep-network
name: Keep Network
description: >-
  Keep Network is a privacy-focused blockchain infrastructure project that
  merged with NuCypher in 2021 to form the Threshold Network. Its flagship
  product is tBTC, a decentralized, trust-minimized bridge that tokenizes
  Bitcoin as the TBTC ERC-20 token so it can be used across Ethereum DeFi
  without centralized custodians. Keep originally provided off-chain "keeps"
  — private data containers secured by a threshold ECDSA signing network and a
  random beacon — enabling confidential data to be used on public protocols.
  The developer surface is on-chain Solidity smart contracts plus first-party
  JavaScript/TypeScript client libraries published under the @keep-network npm
  scope; there is no hosted REST API. This profile was surfaced as a VC
  portfolio company and enriched from the project's public GitHub org, npm
  packages, blog, and security.txt.
